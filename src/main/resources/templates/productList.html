<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Products</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom right, #dfe9f3, #ffffff);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            color: #333;
        }

        .add-btn {
            background-color: black;
            color: white;
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover {
            background-color: #444;
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            width: 260px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #333;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            background-color: #f0f0f0;
        }

        .price {
            font-weight: 600;
            color: #111;
        }
    </style>
</head>
<body>
<h1>All Products</h1>
<button class="add-btn" onclick="window.location.href='/admin/dashboard'">➕ Add New Product</button>

<div class="product-container">
    <a class="card" th:each="product : ${products}" th:href="@{'/admin/product/' + ${product.id}}">
        <img th:src="@{${product.imageUrl}}" alt="Product Image" class="product-img" />
        <h3 th:text="${product.name}">Product Name</h3>
        <p th:text="${product.shortDescp}">Description</p>
        <p th:text="${product.description}">Description detail</p>
        <p class="price">₹<span th:text="${product.price}">0.00</span></p>
        <p class="material"><span th:text="${product.material}">Cotton</span></p>
        <p class="features"><span th:text="${product.feature}">Comfortable Cotton</span> </p>
    </a>
</div>
</body>
</html>
