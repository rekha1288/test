<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 50px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, textarea {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            transition: border 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #000;
        }

        button {
            background-color: black;
            color: white;
            padding: 10px 20px;
            border: 2px solid black;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            align-self: center;
            width: auto;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: white;
            color: black;
            border: 2px solid black;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: black;
            font-weight: 500;
            border: 2px solid transparent;
            padding: 8px 14px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            border-color: black;
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Add New Product</h2>

    <form th:action="@{/admin/showDetails}" method="post" enctype="multipart/form-data" th:object="${product}">
        <input type="text" th:field="*{name}" placeholder="Product Name" required>
        <textarea th:field="*{shortDescp}" placeholder="Product Description" rows="3"></textarea>
        <textarea th:field="*{description}" placeholder="Product Description"
                  rows="10" style="min-height: 150px; resize: vertical;" maxlength="5000"></textarea>
        <input type="number" th:field="*{price}" step="0.01" placeholder="Product Price" required>
        <input type="text" th:field="*{material}" placeholder="Materials Used">
        <input type="text" th:field="*{size}" placeholder="Available sizes">
        <input type="text" th:field="*{features}" placeholder="Features of the product">
        <input type="file" name="imageFile" accept="image/*" required>
        <button type="submit">Add Product</button>
    </form>

    <a href="/admin/productList" class="back-btn">📦 View Added Products</a>
</div>

</body>
</html>
