<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; font-family: 'Poppins', sans-serif; }
        .summary-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            padding: 25px;
        }
        .product-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
        }
        .btn-back {
            background-color: #6c757d;
            color: white;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>
<header class="bg-dark text-white text-center py-3">
    <h2 class="mb-0">🛒 Order Summary</h2>
</header>

<div class="container py-5">
    <div class="summary-card">
        <h5 class="mb-4">Your Ordered Items</h5>

        <table class="table align-middle">
            <thead>
            <tr>
                <th>Item</th>
                <th>Product</th>
                <th>Price</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
                <td><img th:src="${item.imageUrl}" alt="Product Image" class="product-img"></td>
                <td th:text="${item.name}"></td>
                <td th:text="'₹' + ${item.price * item.quantity}"></td>
            </tr>
            </tbody>
        </table>

        <hr>
        <div class="d-flex justify-content-between fw-bold fs-5">
            <span>Total Amount:</span>
            <span th:text="'₹' + ${total}"></span>
        </div>

        <!-- ✅ Single clean form -->
        <form th:action="@{/order/final}" method="post" class="mt-4 text-center">
            <!-- Hidden customer info -->
            <input type="hidden" name="firstName" th:value="${firstName}">
            <input type="hidden" name="lastName" th:value="${lastName}">
            <input type="hidden" name="email" th:value="${email}">
            <input type="hidden" name="address" th:value="${address}">
            <input type="hidden" name="city" th:value="${city}">
            <input type="hidden" name="postal" th:value="${postal}">
            <input type="hidden" name="paymentMethod" th:value="${paymentMethod}">

            <div class="d-flex justify-content-center gap-3 mt-4">
                <a th:href="@{/cart/checkOut}" class="btn btn-back px-4">⬅ Back</a>
                <button type="submit" class="btn btn-success px-4">✅ Confirm Order</button>
            </div>
        </form>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2025 Fashion Store. All Rights Reserved.</p>
</footer>
</body>
</html>
