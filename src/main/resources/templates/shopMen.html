<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Men’s Collection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }
        .product-card {
          background: #fff;
          border-radius: 10px;
          transition: 0.3s ease;
          overflow: hidden;
        }
        .product-card:hover {
          transform: translateY(-5px);
          box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .product-card img {
          width: 100%;
          height: 300px;
          object-fit: cover;
        }
        .card-detail {
          padding: 15px;
          text-align: center;
        }
        .section-title {
          font-weight: bold;
          text-transform: uppercase;
        }
    </style>
</head>

<body>
<!-- Header -->
<header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0">Men’s Shirts Collection</h1>
        <a th:href="@{/page}" class="btn btn-outline-light btn-sm">Back to Home</a>
    </div>
</header>

<!-- Product Section -->
<section class="py-5">
    <div class="container">
        <div class="text-center mb-4">
            <h2 class="section-title">Men’s Collection</h2>
            <p class="text-muted">Discover our premium shirt collection</p>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">

            <!-- Product 1 -->
            <div class="col">
                <div class="product-card">
                    <img src="images/shirt-3.webp" alt="Shirt">
                    <div class="card-detail">
                        <h5>Formal Shirt</h5>
                        <p class="fw-bold">₹599</p>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col">
                <div class="product-card">
                    <img src="images/shirt-4.jpg" alt="T-shirt">
                    <div class="card-detail">
                        <h5>Casual T-Shirt</h5>
                        <p class="fw-bold">₹299</p>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col">
                <div class="product-card">
                    <img src="images/shirt-5.webp" alt="Shirt">
                    <div class="card-detail">
                        <h5>Designer Shirt</h5>
                        <p class="fw-bold">₹699</p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2025 Fashion Store. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
