<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }
        .checkout-form, .order-summary {
          background: #fff;
          border-radius: 8px;
          padding: 20px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>

<body>
<header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0">Checkout</h1>
        <a th:href="@{/cart}" class="btn btn-outline-light btn-sm">Back to Cart</a>
    </div>
</header>

<div class="container py-5">
    <div class="row g-4">

        <!-- Billing Details -->
        <div class="col-md-8">
            <div class="checkout-form">
                <h5>Billing Details</h5>
                <hr>

                <!-- ✅ Added id for JavaScript -->
                <form id="checkoutForm" th:action="@{/order/success}" method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" name="firstName" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" name="lastName" class="form-control" required>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">Address</label>
                            <input type="text" name="address" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">City</label>
                            <input type="text" name="city" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Postal Code</label>
                            <input type="text" name="postal" class="form-control" required>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">Payment Method</label>
                            <select id="paymentMethod" name="paymentMethod" class="form-select" required>
                                <option value="">Select Payment Option</option>
                                <option value="card">Credit/Debit Card</option>
                                <option value="upi">UPI</option>
                                <option value="cod">Cash on Delivery</option>
                            </select>
                        </div>

                        <!-- ✅ Hidden field sections for payment inputs -->
                        <div id="cardFields" style="display:none;">
                            <div class="mb-3">
                                <label class="form-label">Card Number</label>
                                <input type="text" id="cardNumber" class="form-control" placeholder="1234567812345678">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Expiry (MM/YY)</label>
                                    <input type="text" id="expiry" class="form-control" placeholder="12/25">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">CVV</label>
                                    <input type="text" id="cvv" class="form-control" placeholder="123">
                                </div>
                            </div>
                        </div>

                        <div id="upiFields" style="display:none;">
                            <div class="mb-3">
                                <label class="form-label">UPI ID</label>
                                <input type="text" id="upiId" class="form-control" placeholder="username@bank">
                            </div>
                        </div>

                        <div id="codMessage" class="alert alert-info mt-3" style="display:none;">
                            💵 Cash on Delivery selected — pay when you receive your order.
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100">Place Order</button>
                        </div>
                    </div>
                </form>

            </div>
        </div>

        <!-- Order Summary -->
        <div class="card mt-4">
            <div class="card-body">
                <h4 class="mb-3">🧾 Order Summary</h4>
                <ul class="list-group mb-3">
                    <li th:each="item : ${cartItems}" class="list-group-item d-flex justify-content-between lh-sm">
                        <div>
                            <h6 class="my-0" th:text="${item.name}"></h6>
                            <small class="text-body-secondary" th:text="'Qty: ' + ${item.quantity}"></small>
                        </div>
                        <span class="text-body-secondary" th:text="${item.price * item.quantity}"></span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between">
                        <span><strong>Total (₹)</strong></span>
                        <strong th:text="${total}"></strong>
                    </li>
                </ul>
            </div>
        </div>

    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2025 Fashion Store. All Rights Reserved.</p>
</footer>

<script>
    const paymentMethod = document.getElementById("paymentMethod");
    const cardFields = document.getElementById("cardFields");
    const upiFields = document.getElementById("upiFields");
    const codMessage = document.getElementById("codMessage");
    const form = document.getElementById("checkoutForm");

    // 🔹 Show/hide payment fields dynamically
    paymentMethod.addEventListener("change", function() {
      cardFields.style.display = this.value === "card" ? "block" : "none";
      upiFields.style.display = this.value === "upi" ? "block" : "none";
      codMessage.style.display = this.value === "cod" ? "block" : "none";
    });

    // 🔹 Luhn Algorithm for real card validation
    function isValidCardNumber(number) {
      let sum = 0;
      let shouldDouble = false;
      for (let i = number.length - 1; i >= 0; i--) {
        let digit = parseInt(number.charAt(i));
        if (shouldDouble) {
          digit *= 2;
          if (digit > 9) digit -= 9;
        }
        sum += digit;
        shouldDouble = !shouldDouble;
      }
      return sum % 10 === 0;
    }

    // 🔹 Expiry validation: MM/YY must not be in the past
    function isValidExpiry(expiry) {
      const match = expiry.match(/^(0[1-9]|1[0-2])\/([0-9]{2})$/);
      if (!match) return false;
      const month = parseInt(match[1]);
      const year = 2000 + parseInt(match[2]);
      const now = new Date();
      const expDate = new Date(year, month);
      return expDate > now;
    }

    // 🔹 Validate UPI ID
    function isValidUpi(upi) {
      return /^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(upi);
    }

    // 🔹 Validate on submit
    form.addEventListener("submit", function(e) {
      const method = paymentMethod.value;

      if (method === "card") {
        const cardNumber = document.getElementById("cardNumber").value.trim();
        const expiry = document.getElementById("expiry").value.trim();
        const cvv = document.getElementById("cvv").value.trim();

        if (!/^[0-9]{16}$/.test(cardNumber)) {
          alert("Card number must be 16 digits.");
          e.preventDefault();
          return;
        }
        if (!isValidCardNumber(cardNumber)) {
          alert("Invalid card number. Please check again.");
          e.preventDefault();
          return;
        }
        if (!isValidExpiry(expiry)) {
          alert("Card expiry date is invalid or expired.");
          e.preventDefault();
          return;
        }
        if (!/^[0-9]{3}$/.test(cvv)) {
          alert("Enter a valid 3-digit CVV.");
          e.preventDefault();
          return;
        }
        alert("✅ Card verified successfully!");
      }

      else if (method === "upi") {
        const upiId = document.getElementById("upiId").value.trim();
        if (!isValidUpi(upiId)) {
          alert("Enter a valid UPI ID (example: username@bank).");
          e.preventDefault();
          return;
        }
        alert("✅ UPI ID verified successfully!");
      }

      else if (method === "cod") {
        alert("💵 Cash on Delivery selected — pay when you receive your order.");
      }

      else {
        alert("Please select a payment method.");
        e.preventDefault();
      }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
