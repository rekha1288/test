<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Products</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .product-card {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product-card h3 {
            margin: 15px 0 8px;
            font-size: 20px;
            color: #333;
        }

        .product-card p {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            height: 45px;
            overflow: hidden;
        }

        .price {
            color: #28a745;
            font-weight: bold;
            margin: 10px 0;
            font-size: 18px;
        }

        .btn-view {
            display: inline-block;
            text-decoration: none;
            background: black;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-view:hover {
            background: white;
            color: black;
            border: 2px solid black;
        }
    </style>
</head>
<body>

<h1>🛍️ Our Products</h1>

<div class="product-container">
    <div class="product-card" th:each="product : ${productList}">
        <img th:src="${product.imageUrl}" alt="Product Image">
        <h3 th:text="${product.name}">Product Name</h3>
        <p th:text="${product.description}">Short description...</p>
        <p class="price">₹<span th:text="${product.price}">0.00</span></p>
        <a th:href="@{'/product/details/' + ${product.id}}" class="btn-view">View Details</a>
    </div>
</div>

</body>
</html>
