<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name}">Product Details</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        nav { background-color: black; color: white; padding: 12px 25px; }
        nav a { color: white; text-decoration: none; margin-left: 20px; background-color: #ff6600; padding: 8px 15px; border-radius: 6px; font-weight: bold; }
        nav a:hover { background-color: white; color: black; }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 30px auto;
            max-width: 1000px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            gap: 30px;
        }

        .product-image {
            flex: 1 1 400px;
            max-width: 450px;
        }

        .product-image img {
            width: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .product-info {
            flex: 1 1 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-info h2 { margin-top: 0; font-size: 2rem; color: #333; }
        .product-info .price { font-weight: bold; font-size: 1.5rem; margin: 10px 0; color: #000; }
        .product-info p { color: #555; line-height: 1.5; }

        .add-cart-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        input[type="number"] {
            width: 60px;
            text-align: center;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { background-color: #ff6600; }

        @media (max-width: 800px) {
            .product-container { flex-direction: column; align-items: center; }
            .product-info { align-items: center; text-align: center; }
        }
    </style>
</head>
<body>

<nav>
    <a th:href="@{/page}">🏠 Back to Products</a>
</nav>

<div class="product-container">
    <!-- Product Image -->
    <div class="product-image">
        <img th:src="${product.imageUrl}" alt="Product Image">
    </div>

    <!-- Product Info -->
    <div class="product-info">
        <h2 th:text="${product.name}">Product Name</h2>
        <p class="price">₹<span th:text="${product.price}">0.0</span></p>
        <p th:text="${product.description}">Product Description</p>

        <!-- Add to Cart -->
        <form class="add-cart-section" onsubmit="addToCart(event, this)">
            <input type="hidden" name="productId" th:value="${product.id}">
            <input type="hidden" name="name" th:value="${product.name}">
            <input type="hidden" name="price" th:value="${product.price}">
            <input type="hidden" name="productImg" th:value="${product.imageUrl}">
            <input type="number" name="quantity" value="1" min="1">
            <button type="submit">Add to Cart</button>
        </form>
    </div>
</div>

<script>
    async function addToCart(event, form) {
        event.preventDefault();
        const formData = new FormData(form);
        const data = new URLSearchParams(formData);
        const response = await fetch('/cart/add', { method: 'POST', body: data });
        const result = await response.text();
        if (result === 'success') {
            alert('🛒 Added to cart successfully!');
        } else {
            alert('⚠️ Failed to add to cart.');
        }
    }
</script>

</body>
</html>
