<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Products</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        table {
            width: 95%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: center;
        }

        th {
            background-color: black;
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
        }

        .back-btn {
            margin-top: 25px;
            text-decoration: none;
            background-color: black;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            border: 2px solid black;
            transition: 0.3s ease;
            font-weight: 600;
        }

        .back-btn:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>

<h2>📦 All Added Products</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Image</th>
        <th>Name</th>
        <th>Description</th>
        <th>Price (₹)</th>
        <th>Material</th>
        <th>Size</th>
        <th>Features</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}">1</td>
        <td><img th:src="${product.imageUrl}" alt="Product Image"></td>
        <td th:text="${product.name}">Sample Product</td>
        <td th:text="${product.shortDescp}">Sample Description</td>
        <td th:text="${product.price}">0.00</td>
        <td th:text="${product.material}">Cotton</td>
        <td th:text="${product.size}">M</td>
        <td th:text="${product.features}">Comfortable, Stylish</td>
    </tr>
    </tbody>
</table>

</body>
</html>
